# GitHub Action that runs pytest

name: Run Pytest
on:
  workflow_dispatch:
  push:
  schedule:
    # execute once a week on monday
    - cron:  '0 1 * * 1'

# Only the coverage-badge commit needs write access; nothing else here does.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: 'x64'
      - run: pip install ".[dev]"
      - name: Run tests
        run: |
          pytest --verbose --cov=src tests/ --cov-report=term-missing --cov-report=xml

      # The badge is committed back to the repository, so this must run exactly
      # once (not once per matrix entry, which would race three pushes against
      # each other) and only when HEAD is an actual branch. A tag push checks
      # out a detached HEAD, which is what made the previous version die on
      # "fatal: You are not currently on a branch".
      - name: Update coverage badge
        if: matrix.python-version == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pip install "genbadge[coverage]"
          genbadge coverage -i coverage.xml -o docs/coverage-badge.svg
          if git diff --quiet -- docs/coverage-badge.svg; then
            echo "Coverage badge unchanged, nothing to commit."
            exit 0
          fi
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config user.name "update-coverage-badge[bot]"
          git add docs/coverage-badge.svg
          git commit -m "Auto updating coverage badge [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
